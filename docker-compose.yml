services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mikey
    volumes:
      - ./data/postgres:/var/lib/postgresql
    ports:
      - "5432:5432"
    logging:
      driver: "none"
    stdin_open: false
    tty: false

  app:
    image: node:18-alpine
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app:delegated
      - ./node_modules:/usr/src/app/node_modules:delegated
    ports:
      - "3000:3000"
      - "9229:9229" # Debugging port for Node.js inspector
    # Load PLANNING_CENTER_PAT from Docker secret if present, then run the app
    secrets:
      - PLANNING_CENTER_PAT
    command: |
      sh -c "if [ -f /run/secrets/PLANNING_CENTER_PAT ]; then
      export PLANNING_CENTER_PAT=$(cat /run/secrets/PLANNING_CENTER_PAT)
      fi
      npm install --silent
      npm install --silent nodemon
      if [ \"$$DEV\" = 'true' ]; then
      npx nodemon --watch . --ignore '*.json' --exec \"npm run debug\"
      else
      npm run debug
      fi"
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db:5432/mikey"
      DEV: "false"
      PLANNING_CENTER_SERVICE_TYPE_ID: 6644
    restart: on-failure
    stdin_open: true
    tty: true

secrets:
  PLANNING_CENTER_PAT:
    file: ./secrets/planning_center_pat.txt
